name: 催事データ更新とPages公開
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub Actions の日時は UTC。日本時間6:17と18:17
    - cron: '17 21,9 * * *'
permissions:
  contents: read
concurrency:
  group: takamatsu-taxi-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 必要なライブラリを準備
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: 2施設の公式催事を取得（全件取得不可なら公開中止）
        run: python scripts/fetch_events.py
      - name: GitHub Pagesの公開準備
        uses: actions/configure-pages@v5
      - name: 公開ファイルをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: サイトを更新
        id: deployment
        uses: actions/deploy-pages@v4
