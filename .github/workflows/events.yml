name: 催事データ更新とPages公開
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub Actionsの時刻はUTC。日本時間6:17と18:17
    - cron: '17 21,9 * * *'
permissions:
  contents: read
concurrency:
  group: takamatsu-taxi-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 必要なライブラリを準備
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pymupdf
      - name: アリーナとサンポートホールの催事を取得（施設別に結果を記録）
        run: python scripts/fetch_events.py
      - name: サンメッセ香川の公式催事を取得して統合
        run: python scripts/fetch_sunmesse.py
      - name: 高松国分寺ホールの一般公開催事を取得して統合
        run: python scripts/fetch_kokubunji.py
      - name: やしまーる・屋島山上の一般公開催事を取得して統合
        run: python scripts/fetch_yashimaru.py
      - name: 香川県立総合水泳プールの競技会日程を取得して統合
        run: python scripts/fetch_swim_meets.py
      - name: 穴吹学園ホールの一般公開催事を取得して統合
        run: python scripts/fetch_anabuki_hall.py
      - name: festhalle（フェストハレ）の公式公演を取得して統合
        run: python scripts/fetch_festhalle.py
      - name: 高松DIMEの公式公演を取得して統合
        run: python scripts/fetch_dime.py
      - name: 高松オリーブホールの公式公演を取得して統合
        run: python scripts/fetch_olive_hall.py
      - name: 香川県文化会館の公式催物を取得して統合
        run: python scripts/fetch_kagawa_bunkakaikan.py
      - name: 高松市美術館の公式展覧会を取得して統合
        run: python scripts/fetch_takamatsu_art_museum.py
      - name: 高松MONSTERの公式公演を取得して統合
        run: python scripts/fetch_takamatsu_monster.py
      - name: 高松TOONICEの公式公演を取得して統合
        run: python scripts/fetch_toonice.py
      - name: ゆめタウン高松の公式催事を取得して統合
        run: python scripts/fetch_youme_takamatsu.py
      - name: 公渕森林公園の公式催事を取得して統合
        run: python scripts/fetch_kinbuchi_park.py
      - name: 香川県立図書館の公式行事を取得して統合
        run: python scripts/fetch_kagawa_library.py
      - name: 屋島レクザムフィールドの公式競技日程を取得して統合
        run: python scripts/fetch_yashima_field.py
      - name: レクザムスタジアムの公式大会日程を取得して統合
        run: python scripts/fetch_rexam_stadium.py
      - name: 香川県営サッカー・ラグビー場の公式大会日程を取得して統合
        run: python scripts/fetch_ikushima_football.py
      - name: ふらっと仏生山の公式催事を取得して統合
        run: python scripts/fetch_flat_busshozan.py
      - name: 栗林公園の公式催事を取得して統合
        run: python scripts/fetch_ritsurin_garden.py
      - name: 高松市塩江美術館の公式催事を取得して統合
        run: python scripts/fetch_shionoe_museum.py
      - name: さぬき空港公園の公式催事を取得して統合
        run: python scripts/fetch_sanuki_airport_park.py
      - name: 高松市石の民俗資料館の公式催事を取得して統合
        run: python scripts/fetch_takamatsu_stone_museum.py
      - name: 瀬戸内海歴史民俗資料館の公式催事を取得して統合
        run: python scripts/fetch_setouchi_history_museum.py
      - name: 高松シンボルタワー 展示場の公式催事を取得して統合
        run: python scripts/fetch_symboltower_exhibition.py
      - name: 香川県立ミュージアムの公式催事を取得して統合
        run: python scripts/fetch_kagawa_museum.py
      - name: 四国村ミウゼアムの公式催事を取得して統合
        run: python scripts/fetch_shikokumura.py
      - name: 香川県営テニス場の公式大会日程を取得して統合
        run: python scripts/fetch_ikushima_tennis.py
      - name: 香川県営第2野球場の公式大会日程を取得して統合
        run: python scripts/fetch_ikushima_baseball2.py
      - name: さぬきフラワーガーデンの公式催事を取得して統合
        run: python scripts/fetch_sanuki_flower_garden.py
      - name: しっぽの森の公式催事を取得して統合
        run: python scripts/fetch_shippo_no_mori.py
      - name: 香川県営第2サッカー・ラグビー場の公式大会日程を取得して統合
        run: python scripts/fetch_ikushima_football2.py
      - name: 香南歴史民俗郷土館の公式催事を取得して統合
        run: python scripts/fetch_konan_history.py
      - name: 讃岐国分寺跡資料館の公式催事を取得して統合
        run: python scripts/fetch_sanuki_kokubunji_museum.py
      - name: 丸亀町グリーン けやき広場の公式催事を取得して統合
        run: python scripts/fetch_mgreen_keyaki.py
      - name: コンベンションカレンダーの公開催事を取得
        run: python scripts/fetch_conventions.py
      - name: 高松市総合体育館の公式月間PDFから催事を取得
        run: python scripts/fetch_gym.py
      - name: レクザムホール公式催事を取得
        run: python scripts/fetch_rexam.py
      - name: 香川県の公式PDFから高松港クルーズ船寄港予定を取得
        run: python scripts/fetch_cruise.py
      - name: 公開するファイルをデータと終了案内だけに限定
        run: |
          mkdir -p _site/data
          cp data/*.json _site/data/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex,nofollow">
          <title>旧公開版は終了しました | 高松タクシー・シグナル</title>
          <style>
          :root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#18364a;background:#f2f6f9}*{box-sizing:border-box}body{margin:0;padding:24px}main{margin:10vh auto 0;max-width:650px;padding:28px;background:white;border:1px solid #b4ccd8;border-radius:19px}h1{font-size:clamp(23px,5vw,31px);line-height:1.45}p{font-size:17px;line-height:1.85}a{display:inline-block;padding:14px 18px;background:#096d81;color:white;border-radius:12px;text-decoration:none;font-size:17px;font-weight:700}</style>
          </head>
          <body><main>
          <h1>旧公開版は終了しました</h1>
          <p>高松タクシー・シグナルの旧公開版アプリは提供を終了しました。新しい商用版はLINE会員ログインからご利用ください。</p>
          <p><a href="https://takamatsu-taxi-commercial.shikishimanipponn5.workers.dev/member">商用版・LINE会員ログイン</a></p>
          </main>
          <script>
          (async()=>{try{if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(r=>r.unregister()));}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('takamatsu-taxi-signal-')).map(k=>caches.delete(k)));}}catch(e){}})();
          </script>
          </body>
          </html>
          HTML
          cp _site/index.html _site/404.html
      - name: GitHub Pagesの公開準備
        uses: actions/configure-pages@v5
      - name: 公開ファイルをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: サイトを更新
        id: deployment
        uses: actions/deploy-pages@v4
