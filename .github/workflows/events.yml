name: 催事データ更新とPages公開
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub Actionsの時刻はUTC。日本時間6:17と18:17
    - cron: '17 21,9 * * *'
permissions:
  contents: read
concurrency:
  group: takamatsu-taxi-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 必要なライブラリを準備
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pymupdf
      - name: アリーナとサンポートホールの催事を取得（施設別に結果を記録）
        run: python scripts/fetch_events.py
      - name: コンベンションカレンダーの公開催事を取得
        run: python scripts/fetch_conventions.py
      - name: 高松市総合体育館の公式月間PDFから催事を取得
        run: python scripts/fetch_gym.py
      - name: レクザムホール公式催事を取得
        run: python scripts/fetch_rexam.py
      - name: 香川県の公式PDFから高松港クルーズ船寄港予定を取得
        run: python scripts/fetch_cruise.py
      - name: 公開するファイルをデータと終了案内だけに限定
        run: |
          mkdir -p _site/data
          cp data/*.json _site/data/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex,nofollow">
          <title>旧公開版は終了しました | 高松タクシー・シグナル</title>
          <style>
          :root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#18364a;background:#f2f6f9}*{box-sizing:border-box}body{margin:0;padding:24px}main{margin:10vh auto 0;max-width:650px;padding:28px;background:white;border:1px solid #b4ccd8;border-radius:19px}h1{font-size:clamp(23px,5vw,31px);line-height:1.45}p{font-size:17px;line-height:1.85}a{display:inline-block;padding:14px 18px;background:#096d81;color:white;border-radius:12px;text-decoration:none;font-size:17px;font-weight:700}
          </style>
          </head>
          <body>
          <main>
          <h1>旧公開版は終了しました</h1>
          <p>高松タクシー・シグナルの旧公開版アプリは提供を終了しました。新しい商用版はLINE会員ログインからご利用ください。</p>
          <p><a href="https://takamatsu-taxi-commercial.shikishimanipponn5.workers.dev/member">商用版・LINE会員ログイン</a></p>
          </main>
          <script>
          (async()=>{try{if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(r=>r.unregister()));}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('takamatsu-taxi-signal-')).map(k=>caches.delete(k)));}}catch(e){}})();
          </script>
          </body>
          </html>
          HTML
          cp _site/index.html _site/404.html
      - name: GitHub Pagesの公開準備
        uses: actions/configure-pages@v5
      - name: 公開ファイルをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: サイトを更新
        id: deployment
        uses: actions/deploy-pages@v4
